# Render Blueprint: the FastAPI backend (free plan). Secrets are entered in the Render dashboard.
services:
  - type: web
    name: calorie-tracker-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.3
      - key: SUPABASE_URL
        value: https://ayieercybaewlnqfiocx.supabase.co
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
